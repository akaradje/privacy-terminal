name: refresh

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 08:00 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot market data (CoinGecko)
        run: bash scripts/snapshot.sh
        continue-on-error: true

      - name: Fetch dossiers + sparklines
        run: python data/fetch_detail.py
        continue-on-error: true

      - name: Enrich GitHub dev stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python data/enrich_gh.py
        continue-on-error: true

      - name: Validate data contract
        run: python validate.py

      - name: Build single-file site
        run: |
          python build.py
          cp privacy-terminal.html index.html

      - name: Commit if changed
        run: |
          git config user.name "refresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push
